# zmk-component-bmp-boost@master migrated bmp_boost to the ZMK v0.4 / Zephyr
# 4.1 hardware model (NVS storage, retained-mem boot mode, DCDC) but does not
# set the ZMK_BOARD_COMPAT hint, and there is no bmp_boost//zmk variant.
# Assert compatibility so build-user-config.yml@main's board-compat check
# passes.
CONFIG_ZMK_BOARD_COMPAT=y
